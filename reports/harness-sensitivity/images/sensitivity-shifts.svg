<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Mean absolute task score shift by sensitivity group</title>
  <desc id="desc">Interaction tasks shifted 22.9 points, deterministic tasks 9.0, and policy tasks zero.</desc>
  <rect width="900" height="430" fill="#fbfaf7"/>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#17202a}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#5e6a73}.label{font-size:16px}.value{font-size:18px;font-weight:700}.grid{stroke:#dfe4e7}.bar1{fill:#ef6f6c}.bar2{fill:#2176ae}.bar3{fill:#aab4bc}</style>
  <text x="36" y="42" class="title">Interaction-sensitive tasks moved the most</text>
  <text x="36" y="68" class="sub">Mean absolute change between three-seed task means · percentage points</text>
  <line x1="300" y1="95" x2="300" y2="360" class="grid"/>
  <line x1="500" y1="95" x2="500" y2="360" class="grid"/>
  <line x1="700" y1="95" x2="700" y2="360" class="grid"/>
  <text x="292" y="385" class="sub">0</text><text x="488" y="385" class="sub">10</text><text x="688" y="385" class="sub">20</text>
  <text x="36" y="145" class="label">Security interaction</text><rect x="300" y="116" width="458" height="44" rx="5" class="bar1"/><text x="770" y="145" class="value">22.9</text>
  <text x="36" y="235" class="label">Code deterministic</text><rect x="300" y="206" width="180" height="44" rx="5" class="bar2"/><text x="492" y="235" class="value">9.0</text>
  <text x="36" y="325" class="label">Code policy</text><rect x="300" y="296" width="3" height="44" rx="2" class="bar3"/><text x="315" y="325" class="value">0.0</text>
  <text x="36" y="414" class="sub">Four interaction tasks; two tasks in each Code group.</text>
</svg>
